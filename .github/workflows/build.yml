name: Windows build
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Generate authoritative schema
        run: cargo run --locked --bin export-schema
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          npm run test:editor
          npm run test:batch
          node --experimental-strip-types --test src/lib/update-lock.test.ts
          npm run build
      - name: Check generated API contract
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts
      - name: Focused backend checks
        run: |
          cargo fmt --check
          cargo test --locked --lib
          cargo clippy --locked --all-targets -- -D warnings
      - name: Offline update worker checks
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/update-check.ps1
      - name: Build executable
        run: cargo build --locked --release --bin tracksmith
      - name: Executable smoke check
        run: python scripts/smoke.py target/release/tracksmith.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tracksmith-windows
          path: target/release/tracksmith.exe
